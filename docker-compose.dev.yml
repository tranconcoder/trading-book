services:
  api:
    build:
      context: ./trading-book-api
      dockerfile: Dockerfile.development
    volumes:
      - ./trading-book-api:/app
    ports:
      - "${API_PORT}:3000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: ./trading-book-ui
      dockerfile: Dockerfile.development
    volumes:
      - ./trading-book-ui:/app
    environment:
      - PORT=3001
    ports:
      - "${UI_PORT}:3001"
    restart: always
    depends_on:
      api:
        condition: service_healthy
