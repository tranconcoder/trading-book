services:
  api:
    build:
      context: ./trading-book-api
      dockerfile: Dockerfile.development
    volumes:
      - ./trading-book-api:/app
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    ports:
      - "${API_PORT}:3000"
    restart: always
    depends_on:
      postgres-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: ./trading-book-ui
      dockerfile: Dockerfile.development
    volumes:
      - ./trading-book-ui:/app
    environment:
      - PORT=3001
    ports:
      - "${UI_PORT}:3001"
    restart: always
    depends_on:
      api:
        condition: service_healthy

  postgres-server:
    image: postgres:17-alpine
    container_name: trading-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: