services:
  api:
    build:
      context: ./trading-book-api
      dockerfile: Dockerfile.development
    volumes:
      - ./trading-book-api:/app
    ports:
      - "${API_PORT}:3000"
    restart: always

  ui:
    build:
      context: ./trading-book-ui
      dockerfile: Dockerfile.development
    volumes:
      - ./trading-book-ui:/app
    environment:
      - PORT=3001
    ports:
      - "${UI_PORT}:3001"
    restart: always
